name: CI

on:
  push:
    tags:
      - '*'
  # test only: the shared workflow skips deploy on pull requests
  pull_request:
    branches: [main]
jobs:
  main:
    uses: visibilityspots/github-workflows/.github/workflows/main.yml@main
    with:
      platforms: "linux/amd64,linux/arm64"
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
